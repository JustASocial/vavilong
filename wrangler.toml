name = "vavilong-tools"
main = "worker/src/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "web/dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# Пинг Render каждые 5 минут, чтобы бесплатный инстанс бота не засыпал.
[triggers]
crons = ["*/5 * * * *"]
