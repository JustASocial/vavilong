name: bot

# Бот живёт окнами: раннер держит polling ~5 ч 40 мин, затем аккуратно
# останавливается, сохраняет состояние и запускает следующее окно сам.
# Cron — страховка на случай, если цепочка оборвалась.

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

concurrency:
  group: vavilong-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      WEBAPP_URL: https://vavilong-tools.jpjgho.workers.dev
      PUBLIC_BASE_URL: https://vavilong-tools.jpjgho.workers.dev
      MAX_UPLOAD_MB: "49"
      MAX_CONCURRENT_DOWNLOADS: "2"
      RUN_SECONDS: "20400"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Dependencies
        run: pip install -r requirements.txt

      - name: Restore state
        shell: bash
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state 2>/dev/null && git show FETCH_HEAD:state.enc > /tmp/state.enc 2>/dev/null; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/state.enc -out data/bot.sqlite3 -pass env:STATE_KEY; then
              echo "state restored"
            else
              rm -f data/bot.sqlite3
              echo "state could not be decrypted, starting fresh"
            fi
          else
            echo "no saved state yet"
          fi

      - name: Clock
        run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run bot
        run: python -m app

      - name: Save state
        if: always()
        shell: bash
        run: |
          if [ ! -f data/bot.sqlite3 ]; then echo "nothing to save"; exit 0; fi
          python - <<'PY'
          import sqlite3
          src = sqlite3.connect("data/bot.sqlite3")
          dst = sqlite3.connect("/tmp/state.sqlite3")
          with dst:
              src.backup(dst)
          dst.close()
          src.close()
          PY
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/state.sqlite3 -out /tmp/state.enc -pass env:STATE_KEY
          tmp=$(mktemp -d)
          cp /tmp/state.enc "$tmp/state.enc"
          cd "$tmp"
          git init -q
          git add state.enc
          git -c user.name="vavilong-bot" -c user.email="bot@users.noreply.github.com" commit -qm "state $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:state

      - name: Chain next run
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ran=$(( $(date +%s) - START_TS ))
          echo "window lasted ${ran}s"
          if [ "$ran" -gt 900 ]; then
            gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" && echo "next run queued"
          else
            echo "run was too short, leaving the restart to cron"
          fi
